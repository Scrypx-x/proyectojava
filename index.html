<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Campus Parking</title>
    <link rel="stylesheet" href="/diseño.css">
</head>
<body class="gothic-dashboard">
    <header class="main-header">
        <h1 class="logo-text">Campus Admin</h1>
        <nav class="nav-tools">
            <input type="search" placeholder="Buscar placa...">
            <button id="btn-logout">Salir</button>
        </nav>
    </header>

    <main class="content-grid">
        <section class="card-column">
            <h3>Registro de Ingreso</h3>
            <form id="form-registro">
                <input type="text" id="placa" placeholder="Número de Placa" required>
                <input type="text" id="propietario" placeholder="Nombre Propietario" required>
                <button type="button" id="btn-registrar">Registrar</button>
            </form>
        </section>

        <article class="card-column">
            <h3>Estado Actual</h3>
            <p>Espacios disponibles: <span id="count">45</span></p>
        </article>

        <aside class="card-column">
            <h3>Modificar Registro</h3>
            <form id="form-edicion">
                <p class="helper-text">Ingrese la placa para editar</p>
                <input type="text" id="edit-placa-busqueda" placeholder="Buscar Placa..." required>
                <hr class="gothic-divider">
                <input type="text" id="edit-nombre" placeholder="Nuevo Nombre Propietario">
                <button type="button" id="btn-actualizar" class="btn-secondary">Actualizar Datos</button>
            </form>
        </aside>
    </main>
    <script src="campusparking.js"></script>
</body>
</html>
